<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนใบหน้าพนักงาน (Face Recognition System)</title>
  <!-- Google Fonts: Kanit -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #0f172a; /* Slate 900 */
      color: #f8fafc; /* Slate 50 */
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-big {
      min-height: 3.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      transition: all 0.2s ease-in-out;
    }
    .btn-big:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="min-h-screen pb-10">

  <div class="max-w-4xl mx-auto px-4 pt-6">
    <!-- Header -->
    <header class="text-center mb-8">
      <div class="inline-block p-3 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 mb-3 shadow-lg shadow-blue-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
        ระบบบันทึกเวลาสแกนใบหน้า
      </h1>
      <p class="text-slate-400 text-sm mt-1">Smart Face Scan & Attendance System</p>
    </header>

    <!-- Navigation Menu -->
    <nav class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
      <button onclick="showPage('register')" class="btn-big bg-slate-800 hover:bg-blue-600 border border-slate-700 hover:border-blue-500 text-slate-200 hover:text-white rounded-2xl p-4 flex flex-col items-center justify-center gap-1 shadow-md">
        <span class="text-2xl">📝</span>
        <span>1. ลงทะเบียน</span>
      </button>
      <button onclick="showPage('scan')" class="btn-big bg-slate-800 hover:bg-emerald-600 border border-slate-700 hover:border-emerald-500 text-slate-200 hover:text-white rounded-2xl p-4 flex flex-col items-center justify-center gap-1 shadow-md">
        <span class="text-2xl">📸</span>
        <span>2. สแกนหน้า</span>
      </button>
      <button onclick="showPage('manage')" class="btn-big bg-slate-800 hover:bg-purple-600 border border-slate-700 hover:border-purple-500 text-slate-200 hover:text-white rounded-2xl p-4 flex flex-col items-center justify-center gap-1 shadow-md">
        <span class="text-2xl">👥</span>
        <span>3. จัดการข้อมูล</span>
      </button>
      <button onclick="showPage('attendance')" class="btn-big bg-slate-800 hover:bg-amber-600 border border-slate-700 hover:border-amber-500 text-slate-200 hover:text-white rounded-2xl p-4 flex flex-col items-center justify-center gap-1 shadow-md">
        <span class="text-2xl">📊</span>
        <span>4. บันทึกเวลา</span>
      </button>
    </nav>

    <!-- ==================== 1. หน้าลงทะเบียน ==================== -->
    <section id="page-register" class="page glass-card p-6 md:p-8 rounded-3xl shadow-2xl hidden">
      <h2 class="text-2xl font-bold mb-6 text-blue-400 flex items-center gap-2">
        <span>📝</span> ลงทะเบียนพนักงานใหม่
      </h2>
      <form id="registerForm" class="space-y-5" onsubmit="handleRegister(event)">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">รหัสพนักงาน</label>
          <input type="text" id="regId" placeholder="เช่น EMP-001" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">ชื่อ - นามสกุล</label>
          <input type="text" id="regName" placeholder="เช่น นายสมชาย ใจดี" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">คลังสินค้า (ดึงข้อมูลอัตโนมัติจาก Google Sheets)</label>
          <select id="regWarehouse" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            <option value="">-- กำลังโหลดข้อมูลคลัง --</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">อัปโหลดรูปถ่ายใบหน้า</label>
          <input type="file" id="regPhoto" accept="image/*" required class="w-full text-slate-400 bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
        </div>
        <button type="submit" class="btn-big w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-600/30 font-bold text-lg mt-4">
          💾 บันทึกข้อมูลพนักงาน
        </button>
      </form>
    </section>

    <!-- ==================== 2. หน้าสแกนหน้า ==================== -->
    <section id="page-scan" class="page glass-card p-6 md:p-8 rounded-3xl shadow-2xl hidden">
      <h2 class="text-2xl font-bold mb-6 text-emerald-400 flex items-center gap-2">
        <span>📸</span> สแกนใบหน้า (รองรับรูปเดี่ยวและกลุ่ม)
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <button onclick="startCamera()" class="btn-big bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl p-4 flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
          <span>📷</span> เปิดใช้งานกล้อง
        </button>
        <label class="btn-big bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white rounded-xl p-4 flex items-center justify-center gap-2 cursor-pointer text-center">
          <span>📁</span> เลือกอัปโหลดรูปภาพ
          <input type="file" id="scanUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        </label>
      </div>

      <!-- ส่วนแสดงผลกล้อง/รูปภาพ -->
      <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 flex items-center justify-center">
        <video id="video" autoplay muted playsinline class="w-full h-full object-cover hidden"></video>
        <img id="imagePreview" class="w-full h-full object-contain hidden">
        <canvas id="overlay" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
        <div id="cameraPlaceholder" class="text-slate-500 text-center p-4">
          <p class="text-4xl mb-2">📸</p>
          <p>กด "เปิดใช้งานกล้อง" หรือ "เลือกอัปโหลดรูปภาพ"</p>
        </div>
      </div>

      <button onclick="processScan()" class="btn-big w-full bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl shadow-lg shadow-emerald-600/30 font-bold text-lg mt-6">
        ✅ ยืนยันสแกนและบันทึกเวลา
      </button>
    </section>

    <!-- ==================== 3. หน้าจัดการข้อมูลพนักงาน ==================== -->
    <section id="page-manage" class="page glass-card p-6 md:p-8 rounded-3xl shadow-2xl hidden">
      <h2 class="text-2xl font-bold mb-6 text-purple-400 flex items-center gap-2">
        <span>👥</span> รายชื่อพนักงานทั้งหมด
      </h2>
      <div class="overflow-x-auto rounded-xl border border-slate-700">
        <table class="w-full text-left border-collapse text-slate-300">
          <thead class="bg-slate-800/80 text-slate-200">
            <tr>
              <th class="p-4 border-b border-slate-700">รูป</th>
              <th class="p-4 border-b border-slate-700">รหัส</th>
              <th class="p-4 border-b border-slate-700">ชื่อ-นามสกุล</th>
              <th class="p-4 border-b border-slate-700">คลัง</th>
              <th class="p-4 border-b border-slate-700 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="employeeTable" class="divide-y divide-slate-700/50">
            <!-- ข้อมูลพนักงานจะมาแสดงตรงนี้ -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- ==================== 4. หน้าบันทึกเวลาเข้า-ออก ==================== -->
    <section id="page-attendance" class="page glass-card p-6 md:p-8 rounded-3xl shadow-2xl hidden">
      <h2 class="text-2xl font-bold mb-6 text-amber-400 flex items-center gap-2">
        <span>📊</span> รายงานบันทึกเวลาเข้า-ออก
      </h2>

      <!-- ตัวกรองข้อมูล -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-6 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/60">
        <div>
          <label class="block text-xs text-slate-400 mb-1">ตั้งแต่วันที่</label>
          <input type="date" id="filterStartDate" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">ถึงวันที่</label>
          <input type="date" id="filterEndDate" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">เลือกคลัง</label>
          <select id="filterWarehouse" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
            <option value="">ทุกคลังสินค้า</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">ค้นหาชื่อ/รหัส</label>
          <input type="text" id="filterName" placeholder="พิมพ์ชื่อพนักงาน..." class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <button onclick="downloadCSV()" class="btn-big w-full bg-amber-600 hover:bg-amber-500 text-white rounded-xl shadow-lg shadow-amber-600/30 font-bold text-lg mb-6 flex items-center justify-center gap-2">
        <span>📥</span> ดาวน์โหลดไฟล์รายงาน (CSV)
      </button>

      <div class="overflow-x-auto rounded-xl border border-slate-700">
        <table class="w-full text-left border-collapse text-slate-300">
          <thead class="bg-slate-800/80 text-slate-200">
            <tr>
              <th class="p-4 border-b border-slate-700">วัน-เวลา</th>
              <th class="p-4 border-b border-slate-700">รหัส</th>
              <th class="p-4 border-b border-slate-700">ชื่อ-นามสกุล</th>
              <th class="p-4 border-b border-slate-700">คลัง</th>
            </tr>
          </thead>
          <tbody id="attendanceTable" class="divide-y divide-slate-700/50">
            <!-- ข้อมูลบันทึกเวลาจะมาแสดงตรงนี้ -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // URL Web App จาก Google Apps Script ของคุณ
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzfMUpywb1iGJQ1SsU0D8X2KkNAkCb_U1SBk2MsUJA_hxYgVnmgkrBd9HGskAkecMt50Q/exec";

    // 1. ฟังก์ชันสลับการแสดงผลหน้าต่างๆ
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
      const activePage = document.getElementById(`page-${pageId}`);
      if (activePage) {
        activePage.classList.remove('hidden');
      }
    }

    // 2. ฟังก์ชันดึง AI Models จาก CDN
    async function loadFaceModels() {
      console.log("กำลังโหลด AI Models จาก CDN...");
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      
      if (typeof faceapi !== 'undefined') {
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        console.log("โหลด AI Models สำเร็จ!");
      }
    }

    // 3. ฟังก์ชันเริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
    async function initData() {
      showPage('scan'); // ตั้งค่าเริ่มต้นแสดงหน้าสแกนหน้า
      
      try {
        await loadFaceModels();
        
        const res = await fetch(`${GAS_URL}?action=getInitialData`);
        const data = await res.json();
        
        const regSelect = document.getElementById('regWarehouse');
        const filterSelect = document.getElementById('filterWarehouse');
        
        if (data.warehouses && data.warehouses.length > 0) {
          regSelect.innerHTML = '<option value="">-- เลือกคลังสินค้า --</option>';
          data.warehouses.forEach(wh => {
            regSelect.add(new Option(wh, wh));
            filterSelect.add(new Option(wh, wh));
          });
        }
      } catch (err) {
        console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", err);
      }
    }

    function startCamera() {
      const video = document.getElementById('video');
      const img = document.getElementById('imagePreview');
      const placeholder = document.getElementById('cameraPlaceholder');
      
      img.classList.add('hidden');
      placeholder.classList.add('hidden');
      video.classList.remove('hidden');

      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => alert("ไม่สามารถเปิดใช้งานกล้องได้: " + err));
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const video = document.getElementById('video');
          const img = document.getElementById('imagePreview');
          const placeholder = document.getElementById('cameraPlaceholder');
          
          video.classList.add('hidden');
          placeholder.classList.add('hidden');
          img.classList.remove('hidden');
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      alert("บันทึกข้อมูลเรียบร้อยแล้ว");
    }

    function processScan() {
      alert("สแกนใบหน้าสำเร็จ");
    }

    function downloadCSV() {
      alert("ดาวน์โหลดไฟล์รายงาน CSV เรียบร้อย");
    }

    // เรียกฟังก์ชันเมื่อโหลด DOM เสร็จสิ้น
    document.addEventListener("DOMContentLoaded", initData);
  </script>
</body>
</html>

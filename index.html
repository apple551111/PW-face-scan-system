<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Recognition Attendance System</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-big { min-height: 3rem; font-size: 0.95rem; font-weight: 600; transition: all 0.2s ease-in-out; }
    .btn-big:active { transform: scale(0.97); }
    .mode-btn-active { border: 2px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
    .camera-container { width: 100%; max-width: 400px; aspect-ratio: 3 / 4; margin: 0 auto; }
  </style>
</head>
<body class="min-h-screen pb-10" onload="initData()">
  <div class="max-w-5xl mx-auto px-4 pt-4">
    <header class="text-center mb-4">
      <h1 class="text-2xl font-bold text-white">Face Recognition Attendance System</h1>
    </header>

    <div class="glass-card p-3 rounded-2xl mb-4 flex items-center gap-3">
      <label class="whitespace-nowrap text-xs text-slate-300">🔗 Web App URL:</label>
      <input type="text" id="gasUrlInput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl p-1.5 text-xs text-white opacity-80 cursor-not-allowed">
      <button onclick="initData()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs text-white whitespace-nowrap">Refresh</button>
    </div>

    <nav class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4">
      <button onclick="showPage('scan')" class="btn-big bg-slate-800 hover:bg-slate-700 rounded-xl text-emerald-400">1. Scan Face</button>
      <button onclick="showPage('register')" class="btn-big bg-slate-800 hover:bg-slate-700 rounded-xl text-blue-400">2. Register</button>
      <button onclick="showPage('manage')" class="btn-big bg-slate-800 hover:bg-slate-700 rounded-xl text-purple-400">3. Employees</button>
      <button onclick="showPage('attendance')" class="btn-big bg-slate-800 hover:bg-slate-700 rounded-xl text-amber-400">4. History</button>
      <button onclick="showPage('summary')" class="btn-big bg-slate-800 hover:bg-slate-700 rounded-xl text-rose-400 col-span-2 md:col-span-1">5. Shift Summary</button>
    </nav>

    <!-- Page 1: Scan -->
    <section id="page-scan" class="page glass-card p-4 rounded-3xl">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <button id="btnModeIn" onclick="setScanMode('IN')" class="py-3 rounded-2xl bg-emerald-600 text-white font-bold text-base mode-btn-active flex items-center justify-center gap-2">☀️ Check In</button>
        <button id="btnModeOut" onclick="setScanMode('OUT')" class="py-3 rounded-2xl bg-rose-600 text-white font-bold text-base opacity-60 flex items-center justify-center gap-2">🌙 Check Out</button>
      </div>

      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">🏢 Select Warehouse *:</label>
        <select id="scanWarehouse" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="">-- Please Select Warehouse --</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">⏳ Select Shift * (Required for OT calculation):</label>
        <select id="scanShift" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="">-- Please Select Shift --</option>
        </select>
      </div>

      <div id="modelLoadingStatus" class="text-amber-400 mb-2 text-center text-xs font-semibold">⏳ Loading AI Model...</div>

      <div class="camera-container relative bg-slate-950 rounded-2xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col justify-center items-center">
        <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-10">
          <p class="text-slate-400 mb-3 text-sm">Camera is turned off</p>
          <button onclick="toggleCamera()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm shadow-lg">📷 Open Camera</button>
        </div>
        <video id="video" autoplay muted playsinline class="w-full h-full object-cover"></video>
        <div id="scanOverlay" class="absolute bottom-4 left-1/2 -translate-x-1/2 hidden w-11/12 max-w-md pointer-events-none z-20">
           <div id="scanResult" class="bg-emerald-600/95 text-white px-4 py-2.5 rounded-xl font-medium text-sm text-center shadow-lg border border-emerald-400 backdrop-blur-md">✅ Scan Successful</div>
        </div>
      </div>

      <div class="flex justify-center mt-4">
        <button id="btnToggleCam" onclick="toggleCamera()" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-semibold">Open Camera</button>
      </div>
    </section>

    <!-- Page 2: Register -->
    <section id="page-register" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-lg font-bold mb-4 text-blue-400">📝 Employee Registration</h2>
      <form id="registerForm" class="space-y-4" onsubmit="handleRegister(event)">
        <input type="text" id="regId" placeholder="Employee ID" required class="w-full bg-slate-900 rounded-xl p-3 text-sm text-white border border-slate-700">
        <input type="text" id="regName" placeholder="First & Last Name" required class="w-full bg-slate-900 rounded-xl p-3 text-sm text-white border border-slate-700">
        <select id="regWarehouse" required class="w-full bg-slate-900 rounded-xl p-3 text-sm text-white border border-slate-700">
          <option value="">-- Select Assigned Warehouse --</option>
        </select>
        <input type="file" id="regPhoto" accept="image/*" required class="w-full bg-slate-900 rounded-xl p-2 text-sm text-slate-400 border border-slate-700">
        <button type="submit" id="btnSubmitReg" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-xl font-bold text-sm text-white">Save Employee</button>
      </form>
    </section>

    <!-- Page 3: Manage -->
    <section id="page-manage" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-lg font-bold mb-4 text-purple-400">👥 Employee Directory</h2>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm" id="employeeTable"></table></div>
    </section>

    <!-- Page 4: Attendance -->
    <section id="page-attendance" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-lg font-bold mb-4 text-amber-400">📊 Attendance History</h2>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm" id="attendanceTable"></table></div>
    </section>

    <!-- Page 5: Summary by Date & Shift -->
    <section id="page-summary" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-lg font-bold mb-4 text-rose-400">📈 Daily Shift Summary</h2>
      
      <!-- Filters -->
      <div class="mb-5 grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
        <div>
          <label class="block text-xs text-slate-400 mb-1">📅 Select Date:</label>
          <input type="date" id="summaryDateFilter" onchange="loadSummaryShifts()" class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white w-full">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">🏢 Filter by Warehouse:</label>
          <select id="summaryWarehouseFilter" onchange="loadSummaryShifts()" class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white w-full">
            <option value="">-- All Warehouses --</option>
          </select>
        </div>
      </div>

      <div id="summaryShiftContainer">
        <p class="text-slate-400 text-sm text-center py-6">Please select a date above to view shift details.</p>
      </div>

      <div id="summaryDetailContainer" class="mt-6 hidden">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3 bg-slate-900/40 p-3 rounded-xl border border-slate-800">
          <h3 id="summaryDetailTitle" class="text-sm md:text-md font-bold text-amber-300">Shift Details: -</h3>
          <div class="flex items-center gap-2">
            <button onclick="downloadCurrentShiftCSV()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold text-white transition-all shadow flex items-center gap-1">📥 Download CSV</button>
            <button onclick="backToSummaryShifts()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs text-white transition-all shadow">⬅️ Back</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm" id="summaryDetailTable"></table>
        </div>
      </div>
    </section>

  </div>

  <script>
    let GAS_URL = "";
    let employeesData = [];
    let attendancesRaw = [];
    let shiftsData = [];
    let warehousesData = [];
    let faceMatcher = null;
    let scanCooldown = false;
    let currentScanMode = "IN";
    let isCameraActive = false;
    let mediaStream = null;

    let currentActiveShift = "";
    let currentActiveWarehouse = "";
    let currentActiveDateStr = "";

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
      document.getElementById(`page-${pageId}`).classList.remove('hidden');
      if (pageId !== 'scan') { stopCamera(); }
      if (pageId === 'summary') {
        const dateInput = document.getElementById('summaryDateFilter');
        if (!dateInput.value) {
          const today = new Date().toISOString().split('T')[0];
          dateInput.value = today;
        }
        
        const sumWh = document.getElementById('summaryWarehouseFilter');
        const currentSelectedWh = sumWh.value;
        sumWh.innerHTML = '<option value="">-- All Warehouses --</option>';
        warehousesData.forEach(wh => sumWh.add(new Option(wh, wh)));
        sumWh.value = currentSelectedWh;

        loadSummaryShifts();
      }
    }

    function setScanMode(mode) {
      currentScanMode = mode;
      const btnIn = document.getElementById('btnModeIn');
      const btnOut = document.getElementById('btnModeOut');
      if (mode === 'IN') {
        btnIn.classList.add('mode-btn-active'); btnIn.classList.remove('opacity-60');
        btnOut.classList.remove('mode-btn-active'); btnOut.classList.add('opacity-60');
      } else {
        btnOut.classList.add('mode-btn-active'); btnOut.classList.remove('opacity-60');
        btnIn.classList.remove('mode-btn-active'); btnIn.classList.add('opacity-60');
      }
    }

    async function safeFetchJson(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const text = await res.text();
        try { return JSON.parse(text); } 
        catch (err) { throw new Error("Invalid URL or Web App permission not set to 'Anyone'"); }
      } catch (err) {
        throw new Error(err.message || "Cannot connect to Web App");
      }
    }

    async function initData() {
      GAS_URL = window.location.href.split('?')[0];
      
      try {
        const data = await safeFetchJson(`${GAS_URL}?action=getInitialData`);
        
        if (data.webAppUrl && data.webAppUrl.includes("script.google.com")) {
          GAS_URL = data.webAppUrl;
          document.getElementById("gasUrlInput").value = GAS_URL;
        } else {
          document.getElementById("gasUrlInput").value = GAS_URL;
        }

        warehousesData = data.warehouses || [];
        const scanWh = document.getElementById('scanWarehouse');
        scanWh.innerHTML = '<option value="">-- Please Select Warehouse --</option>';
        warehousesData.forEach(wh => scanWh.add(new Option(wh, wh)));

        const regWh = document.getElementById('regWarehouse');
        regWh.innerHTML = '<option value="">-- Select Assigned Warehouse --</option>';
        warehousesData.forEach(wh => regWh.add(new Option(wh, wh)));

        shiftsData = data.shifts || [];
        const scanShift = document.getElementById('scanShift');
        scanShift.innerHTML = '<option value="">-- Please Select Shift --</option>';
        shiftsData.forEach(sh => scanShift.add(new Option(sh, sh)));

        employeesData = data.employees || [];
        attendancesRaw = data.attendances || [];

        renderEmpTable();
        renderAttTable(attendancesRaw);

        await initFaceAPI();

      } catch (err) {
        let savedUrl = localStorage.getItem("CUSTOM_GAS_URL");
        if (savedUrl && !GAS_URL.includes("script.google.com")) {
          GAS_URL = savedUrl;
          document.getElementById("gasUrlInput").value = GAS_URL;
          try {
            const data2 = await safeFetchJson(`${GAS_URL}?action=getInitialData`);
            warehousesData = data2.warehouses || [];
            const scanWh = document.getElementById('scanWarehouse');
            scanWh.innerHTML = '<option value="">-- Please Select Warehouse --</option>';
            warehousesData.forEach(wh => scanWh.add(new Option(wh, wh)));

            const regWh = document.getElementById('regWarehouse');
            regWh.innerHTML = '<option value="">-- Select Assigned Warehouse --</option>';
            warehousesData.forEach(wh => regWh.add(new Option(wh, wh)));

            shiftsData = data2.shifts || [];
            const scanShift = document.getElementById('scanShift');
            scanShift.innerHTML = '<option value="">-- Please Select Shift --</option>';
            shiftsData.forEach(sh => scanShift.add(new Option(sh, sh)));

            employeesData = data2.employees || [];
            attendancesRaw = data2.attendances || [];
            renderEmpTable();
            renderAttTable(attendancesRaw);
            await initFaceAPI();
            return;
          } catch(e) {}
        }
        alert("Failed to load data: " + err.message);
      }
    }

    async function initFaceAPI() {
      const status = document.getElementById('modelLoadingStatus');
      if (typeof faceapi === 'undefined') {
        status.innerText = "❌ Failed to load face recognition library";
        status.className = "text-red-400 mb-2 text-center text-xs font-semibold";
        return;
      }

      try {
        status.innerText = "⏳ Loading face detection models...";
        status.className = "text-amber-400 mb-2 text-center text-xs font-semibold";

        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        status.innerText = "⏳ Processing employee facial data...";
        
        const labeledDescriptors = [];
        for (const emp of employeesData) {
          const photoSrc = emp.photoUrl || emp.photoBase64 || emp.photo;
          if (!photoSrc) continue;
          try {
            const img = await fetchImageFromBase64(photoSrc);
            const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320 }))
              .withFaceLandmarks()
              .withFaceDescriptor();
            if (detection) {
              labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(String(emp.id), [detection.descriptor]));
            }
          } catch(e) {}
        }

        if (labeledDescriptors.length > 0) {
          faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.50);
          status.innerText = `✅ Ready to scan (${labeledDescriptors.length} faces loaded)`;
          status.className = "text-emerald-400 mb-2 text-center text-xs font-semibold";
        } else {
          status.innerText = "❌ No employee face photos found in system";
          status.className = "text-red-400 mb-2 text-center text-xs font-semibold";
        }
      } catch (err) {
        status.innerText = "❌ Failed to load models: " + err.message;
        status.className = "text-red-400 mb-2 text-center text-xs font-semibold";
      }
    }

    function fetchImageFromBase64(base64) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = base64;
      });
    }

    function toggleCamera() {
      if (isCameraActive) stopCamera();
      else startCamera();
    }

    async function startCamera() {
      const video = document.getElementById('video');
      const placeholder = document.getElementById('cameraPlaceholder');
      const btnToggle = document.getElementById('btnToggleCam');

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 480 }, height: { ideal: 640 }, facingMode: "user" } 
        });
        video.srcObject = mediaStream;
        video.onplay = () => { scanLoop(); };
        
        placeholder.classList.add('hidden');
        btnToggle.innerText = "Close Camera";
        btnToggle.className = "px-6 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-semibold";
        isCameraActive = true;
      } catch(err) { alert("Unable to access camera. Please check permissions."); }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      const video = document.getElementById('video');
      if (video) video.srcObject = null;
      
      const placeholder = document.getElementById('cameraPlaceholder');
      const btnToggle = document.getElementById('btnToggleCam');
      
      if (placeholder) placeholder.classList.remove('hidden');
      if (btnToggle) {
        btnToggle.innerText = "Open Camera";
        btnToggle.className = "px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-semibold";
      }
      isCameraActive = false;
    }

    async function scanLoop() {
      const video = document.getElementById('video');
      if (!isCameraActive || !video || video.paused || video.ended || !faceMatcher) return;

      if (!scanCooldown) {
        try {
          const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
            .withFaceLandmarks()
            .withFaceDescriptor();
          
          if (detection) {
            const match = faceMatcher.findBestMatch(detection.descriptor);
            if (match.label !== 'unknown') {
              scanCooldown = true;
              const emp = employeesData.find(e => String(e.id) === String(match.label));
              if (emp) handleAutoScanSuccess(emp);
              else scanCooldown = false;
            }
          }
        } catch(err) {}
      }
      if (isCameraActive) setTimeout(() => requestAnimationFrame(scanLoop), 200);
    }

    async function handleAutoScanSuccess(emp) {
      const warehouseVal = document.getElementById('scanWarehouse').value;
      const shiftVal = document.getElementById('scanShift').value;

      if (!warehouseVal) {
        alert("⚠️ Please select a Warehouse before scanning!");
        scanCooldown = false;
        return;
      }
      if (!shiftVal) {
        alert("⚠️ Please select a Shift before scanning!");
        scanCooldown = false;
        return;
      }

      const overlay = document.getElementById('scanOverlay');
      const resultBox = document.getElementById('scanResult');
      const modeText = (currentScanMode === "IN") ? "Check-in" : "Check-out";

      overlay.classList.remove('hidden');
      resultBox.className = (currentScanMode === "IN") 
        ? "bg-emerald-600/95 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-lg text-center"
        : "bg-rose-600/95 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-lg text-center";

      resultBox.innerHTML = `✅ ${modeText} Successful!<br><span class="text-xs text-slate-200">ID: ${emp.id} | Name: ${emp.name} | WH: ${warehouseVal}</span>`;

      try {
        await safeFetchJson(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "recordAttendance",
            data: { 
              id: emp.id, 
              name: emp.name, 
              warehouse: warehouseVal, 
              scanMode: currentScanMode,
              shift: shiftVal
            }
          })
        });

        const refreshData = await safeFetchJson(`${GAS_URL}?action=getInitialData`);
        if (refreshData && refreshData.attendances) {
          attendancesRaw = refreshData.attendances;
          renderAttTable(attendancesRaw);
        }
      } catch(e) {}

      setTimeout(() => {
        overlay.classList.add('hidden');
        scanCooldown = false;
      }, 1800);
    }

    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 320;
            let w = img.width, h = img.height;
            if (w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } 
            else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitReg');
      btn.disabled = true; btn.innerText = "⏳ Saving...";

      try {
        const base64 = await compressImage(document.getElementById('regPhoto').files[0]);
        const payload = {
          id: document.getElementById('regId').value,
          name: document.getElementById('regName').value,
          warehouse: document.getElementById('regWarehouse').value,
          photoBase64: base64
        };

        const res = await safeFetchJson(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "registerEmployee", data: payload })
        });

        if (res.success) {
          alert("Employee registered successfully!");
          document.getElementById('registerForm').reset();
          initData();
          showPage('scan');
        } else { alert(res.message || "An error occurred"); }
      } catch (err) { alert(err.message); }
      finally { btn.disabled = false; btn.innerText = "Save Employee"; }
    }

    function renderEmpTable() {
      const html = employeesData.map(e => {
        const imgUrl = e.photoUrl || e.photoBase64 || e.photo || '';
        return `
        <tr class="border-b border-slate-700">
          <td class="p-2">${imgUrl ? `<img src="${imgUrl}" class="w-8 h-8 rounded-full object-cover">` : ''}</td>
          <td class="p-2 font-mono text-blue-400">${e.id}</td>
          <td class="p-2">${e.name}</td>
          <td class="p-2 text-slate-300 font-semibold">${e.warehouse || '-'}</td>
        </tr>`;
      }).join('');

      document.getElementById('employeeTable').innerHTML = 
        `<tr><th class="p-2 text-slate-400">Photo</th><th class="p-2 text-slate-400">ID</th><th class="p-2 text-slate-400">Name</th><th class="p-2 text-slate-400">Warehouse</th></tr>` + html;
    }

    function formatTimeString(timeStr) {
      if (!timeStr || timeStr === '-') return '-';
      if (/^\d{2}:\d{2}(:\d{2})?$/.test(timeStr)) return timeStr;
      
      const d = new Date(timeStr);
      if (!isNaN(d.getTime())) {
        return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      }
      if (typeof timeStr === 'string' && timeStr.includes('T')) {
        const parts = timeStr.split('T')[1];
        if (parts) return parts.substring(0, 8);
      }
      return timeStr;
    }

    function renderAttTable(logs) {
      const rows = (logs || []).map(l => `
        <tr class="border-b border-slate-700 hover:bg-slate-800 transition-colors">
          <td class="p-2 text-xs text-slate-300 font-semibold">${l.date || '-'}</td>
          <td class="p-2 text-emerald-400 font-mono">${l.id || '-'}</td>
          <td class="p-2">${l.name || '-'}</td>
          <td class="p-2 text-cyan-300 font-medium">${l.warehouse || '-'}</td>
          <td class="p-2 text-blue-300">${l.shift || '-'}</td>
          <td class="p-2 text-slate-300">${formatTimeString(l.timeIn)}</td>
          <td class="p-2 text-slate-300">${formatTimeString(l.timeOut)}</td>
          <td class="p-2 text-amber-400 font-semibold">${l.ot && l.ot !== '-' ? l.ot : '-'}</td>
        </tr>`).join('');

      document.getElementById('attendanceTable').innerHTML = 
        `<tr>
           <th class="p-2 text-slate-400">Date</th>
           <th class="p-2 text-slate-400">ID</th>
           <th class="p-2 text-slate-400">Name</th>
           <th class="p-2 text-slate-400">Warehouse</th>
           <th class="p-2 text-slate-400">Shift</th>
           <th class="p-2 text-slate-400">Time In</th>
           <th class="p-2 text-slate-400">Time Out</th>
           <th class="p-2 text-slate-400">OT</th>
         </tr>` + rows;
    }

    function convertDateToDDMMYYYY(isoDateStr) {
      if (!isoDateStr) return "";
      const parts = isoDateStr.split("-");
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoDateStr;
    }

    function loadSummaryShifts() {
      const dateVal = document.getElementById('summaryDateFilter').value; 
      const warehouseFilterVal = document.getElementById('summaryWarehouseFilter').value;
      const targetDateStr = convertDateToDDMMYYYY(dateVal); 
      
      const container = document.getElementById('summaryShiftContainer');
      document.getElementById('summaryDetailContainer').classList.add('hidden');
      container.classList.remove('hidden');

      let matchedLogs = attendancesRaw.filter(l => l.date === targetDateStr);
      if (warehouseFilterVal) {
        matchedLogs = matchedLogs.filter(l => l.warehouse === warehouseFilterVal);
      }

      if (matchedLogs.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm text-center py-6">No attendance records found for ${targetDateStr}${warehouseFilterVal ? ' (Warehouse: ' + warehouseFilterVal + ')' : ''}</p>`;
        return;
      }

      const shiftGroups = {};
      matchedLogs.forEach(l => {
        const sh = l.shift || "Unspecified Shift";
        const wh = l.warehouse || "Unspecified Warehouse";
        const groupKey = `${sh}___${wh}`;
        if (!shiftGroups[groupKey]) {
          shiftGroups[groupKey] = { shift: sh, warehouse: wh, logs: [] };
        }
        shiftGroups[groupKey].logs.push(l);
      });

      let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
      for (const [key, data] of Object.entries(shiftGroups)) {
        html += `
          <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-4 flex items-center justify-between shadow-md hover:border-slate-500 transition-all">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded-lg text-xs font-semibold">🏢 ${data.warehouse}</span>
              </div>
              <h3 class="text-md font-bold text-white mt-1">Shift: ${data.shift}</h3>
              <p class="text-xs text-slate-300 mt-2">Total Employees: <span class="text-emerald-400 font-bold">${data.logs.length}</span></p>
            </div>
            <button onclick="viewShiftDetail('${data.shift}', '${data.warehouse}', '${targetDateStr}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-semibold text-white transition-all shadow whitespace-nowrap">
              View List ➡️
            </button>
          </div>`;
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    function viewShiftDetail(shiftName, warehouseName, dateStr) {
      currentActiveShift = shiftName;
      currentActiveWarehouse = warehouseName;
      currentActiveDateStr = dateStr;

      document.getElementById('summaryShiftContainer').classList.add('hidden');
      document.getElementById('summaryDetailContainer').classList.remove('hidden');
      document.getElementById('summaryDetailTitle').innerText = `🏢 Warehouse: ${warehouseName} | Shift: ${shiftName} (${dateStr})`;

      const matchedLogs = attendancesRaw.filter(l => l.date === dateStr && l.shift === shiftName && l.warehouse === warehouseName);

      const rows = matchedLogs.map((l, idx) => `
        <tr class="border-b border-slate-700 hover:bg-slate-800">
          <td class="p-2 text-slate-400 text-center">${idx + 1}</td>
          <td class="p-2 text-emerald-400 font-mono">${l.id || '-'}</td>
          <td class="p-2 font-medium">${l.name || '-'}</td>
          <td class="p-2 text-cyan-300">${l.warehouse || '-'}</td>
          <td class="p-2 text-slate-300">${formatTimeString(l.timeIn)}</td>
          <td class="p-2 text-slate-300">${formatTimeString(l.timeOut)}</td>
          <td class="p-2 text-amber-400 font-semibold">${l.ot && l.ot !== '-' ? l.ot : '-'}</td>
        </tr>`).join('');

      document.getElementById('summaryDetailTable').innerHTML = `
        <tr>
          <th class="p-2 text-slate-400 text-center w-12">#</th>
          <th class="p-2 text-slate-400">ID</th>
          <th class="p-2 text-slate-400">Name</th>
          <th class="p-2 text-slate-400">Warehouse</th>
          <th class="p-2 text-slate-400">Time In</th>
          <th class="p-2 text-slate-400">Time Out</th>
          <th class="p-2 text-slate-400">OT</th>
        </tr>` + rows;
    }

    function downloadCurrentShiftCSV() {
      const matchedLogs = attendancesRaw.filter(l => l.date === currentActiveDateStr && l.shift === currentActiveShift && l.warehouse === currentActiveWarehouse);
      if (matchedLogs.length === 0) {
        alert("No data available to download");
        return;
      }

      let csvContent = "\uFEFF"; // BOM for Excel Thai language support
      csvContent += "No,Employee ID,Full Name,Warehouse,Shift,Time In,Time Out,OT\n";

      matchedLogs.forEach((l, idx) => {
        const row = [
          idx + 1,
          `"${l.id || ''}"`,
          `"${l.name || ''}"`,
          `"${l.warehouse || ''}"`,
          `"${l.shift || ''}"`,
          `"${formatTimeString(l.timeIn)}"`,
          `"${formatTimeString(l.timeOut)}"`,
          `"${l.ot && l.ot !== '-' ? l.ot : '-'}"`
        ];
        csvContent += row.join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Shift_Summary_${currentActiveWarehouse}_${currentActiveShift}_${currentActiveDateStr.replace(/\//g, '-')}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function backToSummaryShifts() {
      document.getElementById('summaryDetailContainer').classList.add('hidden');
      document.getElementById('summaryShiftContainer').classList.remove('hidden');
    }
  </script>
</body>
</html>

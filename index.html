<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบบันทึกเวลาสแกนใบหน้า</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .card { background-color: #1e293b; border: none; border-radius: 12px; }
    .nav-pills .nav-link { color: #94a3b8; border-radius: 8px; margin: 0 5px; }
    .nav-pills .nav-link.active { background-color: #334155; color: #fff; font-weight: 500; }
    .table { color: #cbd5e1; }
    .table thead th { border-bottom: 2px solid #334155; color: #94a3b8; font-weight: 500; }
    .table td { border-bottom: 1px solid #334155; vertical-align: middle; }
    .text-green { color: #4ade80; font-weight: 500; }
    .text-yellow { color: #fbbf24; font-weight: 500; }
    .btn-primary { background-color: #2563eb; border: none; }
    .btn-danger { background-color: #dc2626; border: none; }
  </style>
</head>
<body class="p-4">

  <div class="container max-w-4xl mx-auto mt-4">
    <h3 class="text-center mb-4 fw-bold">ระบบบันทึกเวลา</h3>
    
    <!-- Tabs -->
    <ul class="nav nav-pills justify-content-center mb-4" id="mainTab" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#scan">1. สแกนเข้า-ออก</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#history" onclick="loadData()">2. ประวัติการทำงาน</button></li>
    </ul>

    <div class="tab-content">
      
      <!-- หน้าสแกน -->
      <div class="tab-pane fade show active card p-4 shadow" id="scan">
        <h5 class="mb-4">📋 บันทึกเวลาเข้า-ออกงาน</h5>
        <div class="mb-3">
          <label class="form-label">รหัสพนักงาน</label>
          <input type="text" id="empId" class="form-control bg-dark text-light border-secondary" placeholder="ระบุรหัสพนักงาน...">
        </div>
        <div class="mb-3">
          <label class="form-label">กะการทำงาน (Shift)</label>
          <select id="empShift" class="form-select bg-dark text-light border-secondary"></select>
        </div>
        <div class="d-flex gap-3 mt-4">
          <button class="btn btn-primary flex-grow-1 py-2" onclick="submitScan('IN')">สแกนเข้างาน (Time IN)</button>
          <button class="btn btn-danger flex-grow-1 py-2" onclick="submitScan('OUT')">สแกนออกงาน (Time OUT)</button>
        </div>
        <div id="statusMsg" class="mt-3 text-center fw-bold"></div>
      </div>

      <!-- หน้าประวัติ -->
      <div class="tab-pane fade card p-4 shadow" id="history">
        <h5 class="mb-4">📊 ประวัติเข้างานทั้งหมด (สรุป 1 บรรทัด/คน/วัน)</h5>
        <div class="table-responsive">
          <table class="table table-borderless">
            <thead>
              <tr>
                <th>วันที่</th>
                <th>รหัส</th>
                <th>ชื่อ</th>
                <th>กะ (Shift)</th>
                <th>Time in</th>
                <th>Time out</th>
                <th>OT</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <tr><td colspan="7" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const webAppUrl = "YOUR_WEB_APP_URL_HERE"; // ถ้าใช้ HTML แยกเว็บให้เอา URL มาใส่ตรงนี้ แต่ถ้าใช้ใน Apps Script ลบตรงนี้ได้แล้วใช้ google.script.run
    
    let globalEmployees = [];

    window.onload = () => loadData();

    function loadData() {
      // ดึงข้อมูลผ่าน Web App (doGet)
      google.script.run.withSuccessHandler(function(data) {
          // ใส่ตัวเลือก Shift
          const shiftSelect = document.getElementById("empShift");
          shiftSelect.innerHTML = "";
          data.shifts.forEach(sh => {
            let opt = document.createElement("option");
            opt.value = sh; opt.innerText = sh;
            shiftSelect.appendChild(opt);
          });

          globalEmployees = data.employees;

          // สร้างตารางประวัติ
          const tbody = document.getElementById("historyTableBody");
          tbody.innerHTML = "";
          if (data.attendances.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">ไม่มีข้อมูล</td></tr>';
            return;
          }

          data.attendances.forEach(row => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.date}</td>
              <td class="text-green">${row.id}</td>
              <td>${row.name}</td>
              <td class="text-yellow">${row.shift}</td>
              <td>${row.timeIn}</td>
              <td>${row.timeOut}</td>
              <td>${row.ot}</td>
            `;
            tbody.appendChild(tr);
          });
      }).getInitialData_();
    }

    function submitScan(mode) {
      const id = document.getElementById("empId").value.trim();
      const shift = document.getElementById("empShift").value;
      const msg = document.getElementById("statusMsg");

      if (!id) {
         msg.innerText = "กรุณาระบุรหัสพนักงาน!";
         msg.className = "mt-3 text-center fw-bold text-danger";
         return;
      }

      // หาชื่อพนักงานจาก ID
      const emp = globalEmployees.find(e => e.id === id);
      const name = emp ? emp.name : "-";
      const warehouse = emp ? emp.warehouse : "-";

      msg.innerText = "กำลังบันทึกข้อมูล...";
      msg.className = "mt-3 text-center fw-bold text-warning";

      const payload = {
        action: "recordAttendance",
        data: { id: id, name: name, warehouse: warehouse, shift: shift, scanMode: mode }
      };

      // บันทึกผ่าน Google Script
      google.script.run.withSuccessHandler(function(res) {
          if (res.success) {
            msg.innerText = `บันทึกเวลา ${mode} สำเร็จ!`;
            msg.className = "mt-3 text-center fw-bold text-success";
            document.getElementById("empId").value = "";
            loadData(); // โหลดตารางใหม่
          }
      }).recordAttendance_(payload.data);
    }
  </script>
</body>
</html>

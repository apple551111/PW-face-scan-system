<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนใบหน้าพนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Face-API -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-big { min-height: 3.5rem; font-size: 1.125rem; font-weight: 600; transition: all 0.2s ease-in-out; }
    .btn-big:active { transform: scale(0.97); }
    #scanOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 1rem; pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen pb-10">
  <div class="max-w-4xl mx-auto px-4 pt-6">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-white">ระบบบันทึกเวลาสแกนใบหน้า</h1>
    </header>

    <!-- Web App URL Setup -->
    <div class="glass-card p-4 rounded-2xl mb-6 flex items-center gap-3">
      <label class="whitespace-nowrap">🔗 Web App URL:</label>
      <input type="text" id="gasUrlInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
      <button onclick="saveGasUrl()" class="px-4 py-2 bg-blue-600 rounded-xl text-white">โหลดข้อมูล</button>
    </div>

    <!-- Nav -->
    <nav class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
      <button onclick="showPage('register')" class="btn-big bg-slate-800 rounded-xl">1. ลงทะเบียน</button>
      <button onclick="showPage('scan')" class="btn-big bg-slate-800 rounded-xl">2. สแกนหน้า</button>
      <button onclick="showPage('manage')" class="btn-big bg-slate-800 rounded-xl">3. ข้อมูลพนักงาน</button>
      <button onclick="showPage('attendance')" class="btn-big bg-slate-800 rounded-xl">4. ประวัติ</button>
    </nav>

    <!-- Page 1: Register -->
    <section id="page-register" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-xl font-bold mb-4 text-blue-400">📝 ลงทะเบียนพนักงาน</h2>
      <form id="registerForm" class="space-y-4" onsubmit="handleRegister(event)">
        <input type="text" id="regId" placeholder="รหัสพนักงาน" required class="w-full bg-slate-900 rounded-xl p-3">
        <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" required class="w-full bg-slate-900 rounded-xl p-3">
        <select id="regWarehouse" required class="w-full bg-slate-900 rounded-xl p-3">
          <option value="">-- เลือกคลังสินค้า --</option>
        </select>
        <input type="file" id="regPhoto" accept="image/*" required class="w-full bg-slate-900 rounded-xl p-2 text-slate-400">
        <button type="submit" id="btnSubmitReg" class="w-full bg-blue-600 p-3 rounded-xl font-bold">บันทึกข้อมูล</button>
      </form>
    </section>

    <!-- Page 2: Scan -->
    <section id="page-scan" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-xl font-bold mb-4 text-emerald-400">📸 สแกนใบหน้าเข้างาน</h2>
      <div id="modelLoadingStatus" class="text-amber-400 mb-2 text-center text-sm font-semibold">
        ⏳ กำลังโหลด AI Model และข้อมูลใบหน้า...
      </div>
      <button onclick="startCamera()" id="btnStartCamera" class="w-full bg-emerald-600 p-3 rounded-xl font-bold mb-4 hidden">
        เปิดกล้องสแกน
      </button>
      
      <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-lg border border-slate-700 flex justify-center items-center">
        <video id="video" autoplay muted playsinline class="w-full h-full object-cover hidden"></video>
        <!-- Overlay แจ้งเตือนเมื่อสแกนติด -->
        <div id="scanOverlay" class="hidden">
           <div id="scanResult" class="bg-emerald-500/90 text-white px-6 py-3 rounded-2xl font-bold text-xl shadow-lg transform transition-transform scale-105">
              ✅ เจอใบหน้า: สมชาย ใจดี
           </div>
        </div>
      </div>
    </section>

    <!-- Page 3: Manage -->
    <section id="page-manage" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-xl font-bold mb-4 text-purple-400">👥 รายชื่อพนักงาน</h2>
      <div class="overflow-x-auto"><table class="w-full text-left" id="employeeTable"></table></div>
    </section>

    <!-- Page 4: Attendance -->
    <section id="page-attendance" class="page glass-card p-6 rounded-3xl hidden">
      <h2 class="text-xl font-bold mb-4 text-amber-400">📊 ประวัติเข้างาน</h2>
      <div class="overflow-x-auto"><table class="w-full text-left" id="attendanceTable"></table></div>
    </section>
  </div>

  <script>
    let GAS_URL = localStorage.getItem("CUSTOM_GAS_URL") || "";
    let employeesData = [];
    let faceMatcher = null;
    let isScanning = false;
    let scanCooldown = false;

    // --- Core Functions ---
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
      document.getElementById(`page-${pageId}`).classList.remove('hidden');
    }

    async function safeFetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      try { return JSON.parse(text); } 
      catch (err) { throw new Error("URL ของ App Script ไม่ถูกต้อง หรือยังไม่ได้เปิดสิทธิ์ Anyone"); }
    }

    // --- Init & Load Data ---
    async function initData() {
      if(!GAS_URL) return;
      document.getElementById("gasUrlInput").value = GAS_URL;
      
      try {
        const data = await safeFetchJson(`${GAS_URL}?action=getInitialData`);
        
        // เซ็ต URL จากชีท
        if (data.webAppUrl && data.webAppUrl.includes("script.google.com")) {
          GAS_URL = data.webAppUrl;
          localStorage.setItem("CUSTOM_GAS_URL", GAS_URL);
          document.getElementById("gasUrlInput").value = GAS_URL;
        }

        // โหลดข้อมูลคลัง
        const regWh = document.getElementById('regWarehouse');
        regWh.innerHTML = '<option value="">-- เลือกคลังสินค้า --</option>';
        (data.warehouses || []).forEach(wh => regWh.add(new Option(wh, wh)));

        // โหลดพนักงาน
        employeesData = data.employees || [];
        renderEmpTable();
        
        // โหลดประวัติ
        renderAttTable(data.attendances || []);

        // เตรียม Face Model
        await initFaceAPI();

      } catch (err) {
        alert("โหลดข้อมูลล้มเหลว: " + err.message);
      }
    }

    function saveGasUrl() {
      GAS_URL = document.getElementById("gasUrlInput").value.trim();
      localStorage.setItem("CUSTOM_GAS_URL", GAS_URL);
      initData();
    }

    // --- Face Recognition Logic ---
    async function initFaceAPI() {
      const status = document.getElementById('modelLoadingStatus');
      const btnCam = document.getElementById('btnStartCamera');
      
      status.innerText = "⏳ กำลังโหลด AI Model...";
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      
      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

      status.innerText = "⏳ กำลังเรียนรู้ใบหน้าจากฐานข้อมูล (อาจใช้เวลาสักครู่)...";
      
      // สร้าง Face Matcher จากรูปในชีท
      const labeledDescriptors = [];
      for (const emp of employeesData) {
        if (!emp.photoUrl) continue;
        try {
          const img = await fetchImageFromBase64(emp.photoUrl);
          const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
          if (detection) {
            labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(emp.id, [detection.descriptor]));
          }
        } catch(e) { console.warn("ข้ามรูปภาพที่ไม่สมบูรณ์ของ ID:", emp.id); }
      }

      if (labeledDescriptors.length > 0) {
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55); // ความแม่นยำ (น้อย=เป๊ะมาก, มาก=หลวม)
        status.innerText = `✅ โหลดสำเร็จพร้อมใช้งาน (${labeledDescriptors.length} ใบหน้า)`;
        status.classList.replace('text-amber-400', 'text-emerald-400');
        btnCam.classList.remove('hidden');
      } else {
        status.innerText = "❌ ไม่พบรูปภาพใบหน้าที่ใช้ตรวจจับได้ในฐานข้อมูล กรุณาลงทะเบียนพนักงานก่อน";
        status.classList.replace('text-amber-400', 'text-red-400');
      }
    }

    function fetchImageFromBase64(base64) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = base64;
      });
    }

    async function startCamera() {
      const video = document.getElementById('video');
      video.classList.remove('hidden');
      document.getElementById('btnStartCamera').classList.add('hidden');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.onplay = () => { scanLoop(); };
      } catch(err) { alert("ไม่สามารถเปิดกล้องได้"); }
    }

    async function scanLoop() {
      const video = document.getElementById('video');
      if (video.paused || video.ended || !faceMatcher) return;

      if (!scanCooldown) {
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        
        if (detection) {
          const match = faceMatcher.findBestMatch(detection.descriptor);
          
          if (match.label !== 'unknown') {
            scanCooldown = true; // ล็อคการสแกนชั่วคราว
            const emp = employeesData.find(e => e.id === match.label);
            handleAutoScanSuccess(emp);
          }
        }
      }
      
      // วนลูปเช็คเรื่อยๆ
      setTimeout(() => requestAnimationFrame(scanLoop), 300);
    }

    async function handleAutoScanSuccess(emp) {
      // 1. แสดง UI แจ้งเตือน
      const overlay = document.getElementById('scanOverlay');
      const resultBox = document.getElementById('scanResult');
      overlay.classList.remove('hidden');
      resultBox.innerHTML = `✅ สแกนสำเร็จ!<br><span class="text-sm">รหัส: ${emp.id} | ${emp.name}</span>`;

      // 2. ส่งข้อมูลบันทึกลงชีท Attendance
      try {
        await safeFetchJson(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "recordAttendance",
            data: { id: emp.id, name: emp.name, warehouse: emp.warehouse }
          })
        });
      } catch(e) { console.error("บันทึกเวลาล้มเหลว", e); }

      // 3. ซ่อน UI แจ้งเตือนหลัง 3 วินาที และปลดล็อค Cooldown
      setTimeout(() => {
        overlay.classList.add('hidden');
        scanCooldown = false;
      }, 3000);
    }

    // --- Registration Logic ---
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 400; // ลดขนาดเพื่อให้โมเดลทำงานเร็วขึ้น
            let w = img.width, h = img.height;
            if (w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } 
            else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitReg');
      btn.disabled = true; btn.innerText = "⏳ กำลังบันทึก...";

      try {
        const base64 = await compressImage(document.getElementById('regPhoto').files[0]);
        const payload = {
          id: document.getElementById('regId').value,
          name: document.getElementById('regName').value,
          warehouse: document.getElementById('regWarehouse').value,
          photoBase64: base64
        };

        const res = await safeFetchJson(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "registerEmployee", data: payload })
        });

        if (res.success) {
          alert("บันทึกสำเร็จ!");
          document.getElementById('registerForm').reset();
          initData(); // โหลดใหม่เพื่ออัพเดตโมเดล AI
          showPage('scan');
        } else { alert(res.message); }
      } catch (err) { alert(err.message); }
      finally { btn.disabled = false; btn.innerText = "บันทึกข้อมูล"; }
    }

    // --- Render Tables ---
    function renderEmpTable() {
      const html = employeesData.map(e => `
        <tr class="border-b border-slate-700">
          <td class="p-2">${e.photoUrl ? `<img src="${e.photoUrl}" class="w-10 h-10 rounded-full object-cover">` : ''}</td>
          <td class="p-2 font-mono text-blue-400">${e.id}</td>
          <td class="p-2">${e.name}</td>
          <td class="p-2 text-slate-400">${e.warehouse}</td>
        </tr>`).join('');
      document.getElementById('employeeTable').innerHTML = 
        `<tr><th class="p-2 text-slate-400">รูป</th><th class="p-2 text-slate-400">รหัส</th><th class="p-2 text-slate-400">ชื่อ</th><th class="p-2 text-slate-400">คลัง</th></tr>` + html;
    }

    function renderAttTable(logs) {
      const html = logs.map(l => `
        <tr class="border-b border-slate-700">
          <td class="p-2 text-sm text-slate-400">${new Date(l.time).toLocaleString('th-TH')}</td>
          <td class="p-2 text-emerald-400 font-mono">${l.id}</td>
          <td class="p-2">${l.name}</td>
          <td class="p-2">${l.warehouse}</td>
        </tr>`).join('');
      document.getElementById('attendanceTable').innerHTML = 
        `<tr><th class="p-2 text-slate-400">เวลา</th><th class="p-2 text-slate-400">รหัส</th><th class="p-2 text-slate-400">ชื่อ</th><th class="p-2 text-slate-400">คลัง</th></tr>` + html;
    }

    // Auto-start
    document.addEventListener("DOMContentLoaded", () => {
      showPage('scan');
      if(GAS_URL) initData();
    });
  </script>
</body>
</html>
